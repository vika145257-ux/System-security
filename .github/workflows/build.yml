name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find and unzip project
        run: |
          echo "Files in repo:"
          ls -la
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -1)
          echo "Using zip: $ZIP"
          mkdir proj
          unzip -q "$ZIP" -d proj
          DIR=$(dirname "$(find proj -name settings.gradle | head -1)")
          echo "Project dir: $DIR"
          echo "PROJ_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sambhal-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
